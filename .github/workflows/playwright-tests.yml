name: Playwright Tests
# → shows as workflow name in GitHub Actions tab

on:
  push:
    branches: [ main ]
# → every time you do git push origin main → workflow triggers

  pull_request:
    branches: [ main ]
# → every time someone raises a PR to main → workflow triggers
  workflow_dispatch:  
#for running actions manually

jobs:                         
  playwright-tests:           # job name, can be any

    runs-on: ubuntu-latest    # GitHub's Ubuntu VM

    strategy:                 # parallel matrix
      matrix:
        browser: [chromium, firefox, webkit]   # browsers to test

    steps:                 

      - uses: actions/checkout@v4       #  pulls your code

      - uses: actions/setup-python@v5   #  installs Python
        with:
          python-version: '3.12'       

      - run: pip install -r requirements.txt   

      - run: playwright install ${{ matrix.browser }}        # installs current matrix browser
      - run: playwright install-deps ${{ matrix.browser }}   

      - run: |
          pytest
          --browser ${{ matrix.browser }}
          --screenshot only-on-failure
          --video retain-on-failure
          --html=report.html
          --self-contained-html

        env:
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}   # secret injected here
          BASE_URL: https://www.saucedemo.com             # normal env var

      - uses: actions/upload-artifact@v4    # saves report to GitHub
        if: always()                        # runs even if tests fail
        with:
          name: report-${{ matrix.browser }}       # unique name per browser
          path: |
            report.html
            screenshots/


# Note:
# YAML File anatomy:
# name   → display name in Actions tab
# on     → trigger — when to run
# jobs   → units of work
# steps  → commands inside each job
# uses   → pre-built actions from marketplace
# run    → shell commands you write

# CI runner is a fresh machine — missing Linux system libraries that Chrome needs.
# playwright install chromium       # downloads chromium browser
# playwright install-deps chromium  # installs Linux system deps for it