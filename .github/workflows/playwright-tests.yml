# Note:
# YAML File anatomy:
# name   → display name in Actions tab
# on     → trigger — when to run
# jobs   → units of work
# steps  → commands inside each job
# uses   → pre-built actions from marketplace
# run    → shell commands you write

# CI runner is a fresh machine — missing Linux system libraries that Chrome needs.
# playwright install chromium       # downloads chromium browser
# playwright install-deps chromium  # installs Linux system deps for it